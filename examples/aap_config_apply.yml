---
- name: Configure Ansible Automation Platform
  hosts: all
  connection: local
  become: false
  gather_facts: false
  vars:
    # AAP CaC top level dir
    config_basedir: cac/simple/aap_cac
    # AAP CaC files or directories to read
    # Use . to read everything in basedir
    # config_content: .
    config_content: []
    # config_content:
    #   - aap_settings
    # config_content:
    #   - aap_settings/gateway_settings.yml
    #   - aap_settings/controller_settings.yml
    #
    # config_content:
    #   - org_test/testing.yml

    # Optional list of files to ignore
    # when reading contents of directories
#    config_ignore:
#      - '.*creds.*'
#      - '.*hub.*'

    # Known-good variables in addition to all recognized
    # wildcard variables. Unknown vars must either be added
    # below or have their names fixed for the check to pass
    known_good_variables:
      - aap_configuration_async_delay
      - aap_configuration_async_retries
      - aap_configuration_working_dir
      - aap_request_timeout
      - 'env_.*'
      - hub_auto_approve
      - hub_repository
      - hub_skip_existing_collections
      - '.*secure_logging$'
      - 'tbd_.*'

    # Reject duplicate variable definitions to avoid
    # a new setting to override an earlier one, with
    # the below known-good exceptions in the CaC dir
    known_good_duplicates:
      # For independent EE/collection syncing
      - aap_configuration_async_delay
      - aap_configuration_async_retries
      - aap_request_timeout

    # Settings in files will override these for AAP
    aap_configuration_secure_logging: false
    aap_configuration_dispatcher_exclude_roles:
      - controller_inventory_source_update
      - hub_ee_registry_index
    aap_scm_update_projects: false
    hub_configuration_dispatcher_roles_include_publish: true

  tasks:
    - name: Read list of known AAP CaC wildcard variables
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
        tasks_from: vars_only
        public: true

    # This should also be included in pre-commit / pre-merge checks
    - name: Verify no unknown variable definitions
      vars:
        excludes_regex: "{{ (aap_configuration_all_vars + known_good_variables) | join('|') }}"
      ansible.builtin.shell: >
        set -o pipefail &&
        grep -Ehr '^\w+:' --include='*.yml' {{ config_basedir }}
        | sed 's/:.*//'
        | grep -Ev '^({{ excludes_regex }})'
        | sort -u
        | awk 'BEGIN {print "Unknown variable definitions found:\n"} 1'
      register: unknown_check
      failed_when: >
        (unknown_check.rc != 0 and unknown_check.stderr_lines | length > 0) or
        unknown_check.stdout_lines | length > 2
      changed_when: false

    # This should also be included in pre-commit / pre-merge checks
    - name: Verify no unexpected duplicate variable definitions
      vars:
        excludes_regex: "{{ known_good_duplicates | default(['^check_all$'], true) | join('|') }}"
      ansible.builtin.shell: >
        set -o pipefail &&
        grep -Ehr '^\w+:' --include='*.yml' {{ config_basedir }}
        | sed 's/:.*//'
        | grep -Ev '({{ excludes_regex }})'
        | sort
        | uniq -d
        | awk 'BEGIN {print "Duplicate variable definitions found:\n"} 1'
      register: duplicate_check
      failed_when: duplicate_check.rc != 0 or duplicate_check.stdout_lines | length > 2
      changed_when: false

    # Remove if not using environment-specific variables
    # This should also be included in pre-commit / pre-merge checks
    - name: Verify correct form of environment-specific variables - organizations
      ansible.builtin.shell: >
        set -o pipefail &&
        grep -Ehr '^\w+:' --include='*.yml' {{ config_basedir }}/aap_env
        | sed 's/:.*//'
        | grep -v '^env_'
        | sort
        | uniq
        | awk 'BEGIN {print "Incorrect variable names found:\n"} 1'
      register: env_vars_orgs_check
      failed_when: >
        (env_vars_orgs_check.rc != 0 and env_vars_orgs_check.stderr_lines | length > 0) or
        env_vars_orgs_check.stdout_lines | length > 2
      changed_when: false

    - name: Determine AAP CaC files to apply from webhook payload
      vars:
        env_map:
          devel: dev
          test: test
          prod: prod
        commit_branch: "{{ tower_webhook_payload.ref | regex_replace('^refs/heads/', '') }}"
      ansible.builtin.set_fact:
        config_branch: "{{ commit_branch }}"
        config_content: >-
          {{ ((tower_webhook_payload.commits | default([]) | map(attribute='added')) +
              (tower_webhook_payload.commits | default([]) | map(attribute='modified')))
             | flatten | unique | sort
             | map('regex_replace', '^.*' + (config_basedir | basename) + '/', '')
          }}
      when:
        - tower_webhook_payload.commits is defined
        - aap_env == env_map[commit_branch] | default('')

    - name: Display AAP CaC files determined from webhook payload
      ansible.builtin.debug:
        msg: |
          - aap_env: {{ aap_env }}
          - config_branch: {{ config_branch }}
          - config_content: {{ config_content }}
      when:
        - tower_webhook_payload.commits is defined
        - config_content | length > 0

    - name: Read AAP CaC files
      vars:
        dir_input: "{{ false if item.endswith('yml') else true }}"
        # Remove if not using environment-specific variables
        env_content: "{{ ['aap_env/' + aap_env] }}"
      no_log: "{{ aap_configuration_secure_logging | default(false) }}"
      ansible.builtin.include_vars:
        dir: "{{ (config_basedir + '/' + item) if dir_input else omit }}"
        depth: "{{ config_depth if config_depth is defined and dir_input else omit }}"
        files_matching: "{{ config_matching if config_matching is defined and dir_input else omit }}"
        ignore_files: "{{ config_ignore if config_ignore is defined and dir_input else omit }}"
        ignore_unknown_extensions: "{{ true if dir_input else omit }}"
        file: "{{ (config_basedir + '/' + item) if not dir_input else omit }}"
      loop: "{{ env_content + ([config_content] | flatten | select) }}"

    - name: Apply AAP configuration
      vars:
        dispatch_include_wildcard_vars: true
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
      when: ([config_content] | flatten | select | length) > 0
