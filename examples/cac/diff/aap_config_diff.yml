---
- name: Export AAP in-use configuration
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    export_aap_configuration: false

    aap_configuration_secure_logging: false

    # organization_filter: Default

    output_path: ./filetree_export

    flatten_output: true
    secrets_as_variables: false
    export_inline_object_roles: true

  tasks:
    - name: Remove previous export directory
      ansible.builtin.file:
        path: "{{ output_path }}"
        state: absent
      when: export_aap_configuration | bool

    - name: Export AAP configuration in filetree format
      vars:
        input_tag:
          - gateway
          - controller
          # - hub
          # - eda
      ansible.builtin.include_role:
        name: infra.aap_configuration_extended.filetree_create
        public: true
      when: export_aap_configuration | bool

- name: Compare AAP in-cac vs in-use configuration
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - diff_fallbacks.yml

  vars:
    aap_configuration_secure_logging: false

    config_live_path: ./filetree_export
    config_repo_path: ./aap_cac

    fail_if_different: true

    compare_ignore:
      aap_organizations: '*'
      aap_user_accounts:
        - authenticators
        - authenticator_uid

      gateway_http_ports: '*'
      gateway_organizations: '*'
      gateway_routes: '*'
      gateway_service_clusters: '*'
      gateway_service_keys: '*'
      gateway_service_nodes: '*'
      gateway_services: '*'
      gateway_settings:
        - gateway_proxy_url
        - gateway_token_name
        - AAP_DEPLOYMENT_TYPE
        - CSRF_TRUSTED_ORIGINS
        - NOTIFICATION_RSS_FEED_URL
        - RED_HAT_CONSOLE_URL

      controller_execution_environments:
        - Control Plane Execution Environment
        - Default execution environment
        - Hub Default execution environment
        - Hub Minimal execution environment
        - Minimal execution environment
      controller_instance_groups:
        controlplane: '*'
        default: '*'
        executionplane:
          - instances
          - policy_instance_list
      controller_instances: '*'
      controller_inventories:
        - variables
      # Remove after export is 2.7+ only
      controller_roles: '*'
      controller_schedules:
        - Cleanup Activity Schedule
        - Cleanup Expired Sessions
        - Cleanup Job Schedule
      controller_settings:
        settings:
          - TOWER_URL_BASE

      hub_collection_remotes:
        # Dynamically set in CaC, but required vars are out of scope
        - auth_url
        - prn
      hub_collection_repositories:
        - base_path
        - client_url
        - content_guard
        - hidden
        - prn
        - retain_repo_versions
        - sync
        - wait
      hub_collections: '*'
      hub_custom_collections: '*'
      hub_ee_images: '*'
      hub_ee_registries:
        - is_indexable
        - password
        - policy
        - sync
        - username
        - wait
      hub_ee_repositories:
        - base_path
        - content_guard
        - hidden
        - include_tags
        - exclude_tags
        - namespace
        - private
        - prn
        - registry
        - registry_path
        - repository
        - sync
        - upstream_name
        - wait
      hub_namespaces: '*'

  tasks:
    - name: Fail if configuration directories not found
      ansible.builtin.fail:
        msg: "Configuration directory {{ item }} not found."
      loop:
        - "{{ config_live_path }}"
        - "{{ config_repo_path }}"
      when: item is not directory

    - name: Read AAP in-cac configuration
      no_log: "{{ aap_configuration_secure_logging | default(false) }}"
      ansible.builtin.include_vars:
        dir: "{{ config_repo_path }}"
        ignore_unknown_extensions: true
        name: config_repo

    - name: Read list of known AAP CaC wildcard variables
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch
        tasks_from: vars_only
        public: true

    - name: Combine AAP in-repo wildcard variables
      vars:
        var_name: "{{ item | regex_replace('^(' + aap_configuration_all_vars | join('|') + ')(_.*)?$', '\\1') }}"
        curr_val: "{{ config_repo[item] }}"
        is_dict: "{{ curr_val is mapping }}"
        prev_val: "{{ (config_repo_merged | default({})).get(var_name)
                      | default({} if is_dict else [], true) }}"
      no_log: "{{ aap_configuration_secure_logging | default(false) }}"
      ansible.builtin.set_fact:
        config_repo_merged: >-
          {{ (config_repo_merged | default({}))
             | combine({
                 var_name: (prev_val | combine(curr_val, list_merge='append', recursive=true)
                            if is_dict else
                            (prev_val + curr_val) | unique)
               }, recursive=true) }}
      loop: "{{ (config_repo | default({})).keys()
                | select('match', '^(' + aap_configuration_all_vars | join('|') + ')(_.*)?$')
                | reject('match', '.*_(secure_logging|async_retries|async_delay|loop_delay|enforce_defaults)$') }}"

    - name: Read AAP in-use configuration
      no_log: "{{ aap_configuration_secure_logging | default(false) }}"
      ansible.builtin.include_vars:
        dir: "{{ config_live_path }}"
        ignore_unknown_extensions: true
        name: config_live

    - name: Sanitize live configuration
      ansible.builtin.set_fact:
        config_live_clean: "{{ (config_live | normalize_lists)
                               | omit_ignored(compare_ignore | default({})) }}"

    - name: Merge configurations for comparison
      ansible.builtin.set_fact:
        config_merged: "{{ (config_repo_merged | normalize_lists)
                           | omit_ignored(compare_ignore | default({}))
                           | merge_configs(config_live_clean) }}"

    - name: Compare in-cac vs in-use configurations
      ansible.utils.fact_diff:
        before: "{{ config_merged | normalize_brackets | omit_deletions }}"
        after: "{{ config_live_clean }}"
      register: config_diff

    - name: Fail on difference if requested
      ansible.builtin.fail:
        msg: "Configurations differ."
      when:
        - config_diff is changed
        - fail_if_different | bool
