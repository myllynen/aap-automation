#
# AAP controller configuration - settings
#

controller_configuration_settings_secure_logging: false

# For available settings and their current default values see:
# https://gateway.example.com/api/controller/v2/settings/all/
controller_settings:
  settings:
    # Legacy settings, these must be kept in sync with
    # gateway settings when defined for both components
    AUTH_BASIC_ENABLED: true
    # CSRF_TRUSTED_ORIGINS: []
    DISABLE_LOCAL_AUTH: false
    # LOGIN_REDIRECT_OVERRIDE: ""
    PENDO_TRACKING_STATE: detailed
    # REDHAT_USERNAME: ""
    # REDHAT_PASSWORD: ""
    SESSION_COOKIE_AGE: 900
    SESSIONS_PER_USER: -1
    # SUBSCRIPTIONS_USERNAME: ""
    # SUBSCRIPTIONS_PASSWORD: ""

    # System settings
    ACTIVITY_STREAM_ENABLED: true
    ACTIVITY_STREAM_ENABLED_FOR_INVENTORY_SYNC: false
    ALLOW_METRICS_FOR_ANONYMOUS_USERS: false
    AUTOMATION_ANALYTICS_GATHER_INTERVAL: 14400
    # AUTOMATION_ANALYTICS_URL: https://cloud.redhat.com/api/ingress/v1/upload
    AWX_ANALYTICS_CANDLEPIN_CA: /etc/rhsm/ca/redhat-uep.pem
    # AWX_ANALYTICS_CANDLEPIN_PROXY_URL:
    AWX_ANALYTICS_CANDLEPIN_RENEWAL_THRESHOLD_DAYS: 90
    INDIRECT_NODE_COUNTING_ENABLED: true
    MANAGE_ORGANIZATION_AUTH: false
    ORG_ADMINS_CAN_SEE_ALL_USERS: false
    # NOTIFICATION_IP_ALLOW_LIST: []
    # PROXY_IP_ALLOWED_LIST: []
    # https://access.redhat.com/articles/7112649
    # SUBSCRIPTIONS_CLIENT_ID: "{{ aap_redhat_client_id }}"
    # SUBSCRIPTIONS_CLIENT_SECRET: "{{ aap_redhat_client_secret }}"

    # Job settings
    AD_HOC_COMMANDS:
      - ping
      - win_ping
    ALLOW_JINJA_IN_EXTRA_VARS: template
    ANSIBLE_FACT_CACHE_TIMEOUT: 0
    AWX_ANSIBLE_CALLBACK_PLUGINS: []
    AWX_COLLECTIONS_ENABLED: true
    # AWX_ISOLATION_BASE_PATH:
    AWX_ISOLATION_SHOW_PATHS:
      - /etc/pki/ca-trust:/etc/pki/ca-trust:O
      - /usr/share/pki:/usr/share/pki:O
    AWX_MOUNT_ISOLATED_PATHS_ON_K8S: false
    AWX_ROLES_ENABLED: false
    AWX_RUNNER_KEEPALIVE_SECONDS: 0
    AWX_SHOW_PLAYBOOK_LINKS: false
    AWX_TASK_ENV: {}
    BULK_HOST_MAX_CREATE: 100
    BULK_HOST_MAX_DELETE: 250
    BULK_JOB_MAX_LAUNCH: 100
    # CUSTOM_VENV_PATHS: []
    DEFAULT_EXECUTION_ENVIRONMENT: null
    DEFAULT_INVENTORY_UPDATE_TIMEOUT: 0
    DEFAULT_JOB_IDLE_TIMEOUT: 0
    DEFAULT_JOB_TIMEOUT: 0
    DEFAULT_PROJECT_UPDATE_TIMEOUT: 0
    EVENT_STDOUT_MAX_BYTES_DISPLAY: 1024
    GALAXY_IGNORE_CERTS: "{{ not aap_validate_certs }}"
    GALAXY_TASK_ENV:
      ANSIBLE_FORCE_COLOR: 'false'
      GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
    INCLUDE_DEPRECATED_AWX_VAR_PREFIX: false
    INSIGHTS_TRACKING_STATE: false
    MAX_FORKS: 200
    MAX_WEBSOCKET_EVENT_RATE: 30
    MAX_UI_JOB_EVENTS: 4000
    PROJECT_UPDATE_VVV: false
    REMOTE_HOST_HEADERS:
      - HTTP_X_FORWARDED_FOR
    SCHEDULE_MAX_JOBS: 10
    STDOUT_MAX_BYTES_DISPLAY: 1048576
    UI_LIVE_UPDATES_ENABLED: true

    # Logging settings
#    LOG_AGGREGATOR_ENABLED: true
