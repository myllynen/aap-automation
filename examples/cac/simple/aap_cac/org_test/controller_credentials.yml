#
# AAP organization - controller credentials - common
#

controller_credentials_org_test_common:
  - name: Test Org - Automation Hub Collections Certified Repository
    organization: Test Org
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: https://{{ aap_hostname | regex_replace('^https?://', '') }}/api/galaxy/content/rh-certified/
      token: "{{ hub_token }}"
  - name: Test Org - Automation Hub Collections Validated Repository
    organization: Test Org
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: https://{{ aap_hostname | regex_replace('^https?://', '') }}/api/galaxy/content/validated/
      token: "{{ hub_token }}"
  - name: Test Org - Automation Hub Collections Published Repository
    organization: Test Org
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: https://{{ aap_hostname | regex_replace('^https?://', '') }}/api/galaxy/content/published/
      token: "{{ hub_token }}"
  - name: Test Org - Automation Hub Collections Community Repository
    organization: Test Org
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: https://{{ aap_hostname | regex_replace('^https?://', '') }}/api/galaxy/content/community/
      token: "{{ hub_token }}"

  - name: Test Org - Automation Hub Container Registry
    organization: Test Org
    credential_type: Container Registry
    inputs:
      host: "{{ aap_hostname | regex_replace('^https?://', '') }}"
      # Tokens do not work for the time being with PAH,
      # https://redhat.atlassian.net/browse/AAPRFE-2386
      username: "{{ aap_username | default('admin') }}"
      password: "{{ aap_password | default('Foobar_12') }}"

  - name: Test Org - SCM Credential
    organization: Test Org
    credential_type: Source Control
    inputs:
      username: "{{ test_scm_username | default('admin') }}"
      password: "{{ test_scm_password | default('Foobar_12') }}"
      # ssh_key_data: "{{ lookup('file', lookup('env', 'AAP_KEYS') + '/id_ed25519.scm') }}"
      # ssh_key_unlock: "{{ ssh_key_passphrase | default(omit) }}"
