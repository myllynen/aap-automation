#
# AAP controller configuration - lookup credentials
#

controller_configuration_credentials_secure_logging: false

tbd_controller_credentials_org_test_lookups:
  - name: Test Org - Hashicorp Vault Secret Lookup
    organization: Test Org
    credential_type: HashiCorp Vault Secret Lookup
    inputs:
      url: https://vault.example.com
      namespace: aap
      default_auth_path: approle-aap
      role_id: "{{ aap_vault_role_id | default('changeme') }}"
      secret_id: "{{ aap_vault_secret_id | default('changeme') }}"
      api_version: v2

  - name: Test Org - GitHub App Access Token Lookup
    organization: Test Org
    credential_type: GitHub App Installation Access Token Lookup
    inputs:
      github_api_url: github.example.com/api/v3
      app_or_client_id: "{{ aap_github_client_id | default('changeme') }}"
      install_id: "{{ aap_github_install_id | default('changeme') }}"
      private_rsa_key: "{{ aap_github_rsa_key | default('changeme') }}"

tbd_controller_credentials_org_test_lookup_credentials:
  - name: Test Org - AAP CaC Credential - Vault
    organization: Test Org
    credential_type: Red Hat Ansible Automation Platform
    inputs:
      host: https://{{ aap_hostname | regex_replace('^https?://', '') }}
      verify_ssl: "{{ aap_validate_certs }}"

  - name: Test Org - SCM Credential - GitHub App
    organization: Test Org
    credential_type: Source Control
    inputs:
      username: x-access-token

tbd_controller_credential_input_sources_test_org_vault:
  - target_credential: Test Org - AAP CaC Credential - Vault
    source_credential: Test Org - Hashicorp Vault Secret Lookup
    input_field_name: oauth_token
    metadata:
      auth_path: approle-aap
      secret_backend: AAP
      secret_path: aap/aap-admin
      secret_key: token

  - target_credential: Test Org - SCM Credential - GitHub App
    source_credential: Test Org - GitHub App Access Token Lookup
    input_field_name: password
