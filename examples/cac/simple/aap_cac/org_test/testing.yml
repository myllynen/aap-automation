#
# AAP organization - controller configuration - connectivity, debug, testing
#

controller_credentials_org_test_testing:
  - name: Test Org - Machine Credential
    organization: Test Org
    credential_type: Machine
    inputs:
      username: "{{ test_machine_username | default('admin') }}"
      password: "{{ test_machine_password | default('Foobar_12') }}"
      # ssh_key_data: "{{ lookup('file', lookup('env', 'AAP_KEYS') + '/id_ed25519.machine') }}"
      # ssh_key_unlock: "{{ ssh_key_passphrase | default(omit) }}"

# Uses AAP/organization common EEs

controller_projects_org_test_testing:
  - name: Test Org - Test Project for Git Inventory
    description: Inventory project for testing
    organization: Test Org
    default_environment: Control Plane Execution Environment
    scm_type: git
    scm_url: https://github.com/myllynen/autotest.git
    # scm_credential: Test Org - SCM Credential
    scm_clean: false
    scm_update_on_launch: false
    # scm_update_cache_timeout: 30
    update_project: "{{ aap_scm_update_projects | default(false) }}"

  - name: Test Org - Test Project
    description: Project for testing
    organization: Test Org
    # default_environment: Control Plane Execution Environment
    default_environment: Test Org - Custom Base EE
    scm_type: git
    scm_url: https://github.com/myllynen/misc.git
    # scm_credential: Test Org - SCM Credential
    scm_clean: false
    scm_update_on_launch: false
    # scm_update_cache_timeout: 30
    update_project: "{{ aap_scm_update_projects | default(false) }}"

controller_inventories_org_test_testing:
  - name: Test Org - Test Inventory
    description: Inventory for testing
    organization: Test Org

controller_inventory_sources_org_test_testing:
  - name: Test Org - Test Git Inventory Source
    description: Inventory Source for testing
    organization: Test Org
    execution_environment: Control Plane Execution Environment
    inventory: Test Org - Test Inventory
    source: scm
    source_project: Test Org - Test Project for Git Inventory
    source_path: inventory
    overwrite: true
    overwrite_vars: true
    update_on_launch: false
    # update_cache_timeout: 30
    # verbosity: 2

controller_templates_org_test_testing:
  - name: Test Org - Debug EE Localhost
    description: Test and debug EE/localhost
    organization: Test Org
    inventory: Test Org - EE localhost
    project: Test Org - Test Project
    playbook: debug.yml
    # credentials:
    #   - Test Org - Machine Credential
    job_type: run
    job_slice_count: 1
    verbosity: 0
    # instance_groups:
    #   - Test Org - Instance Group - Common
    roles:
      execute:
        teams:
          - t_api_users

  - name: Test Org - Linux Target Connectivity
    description: Linux connectivity testing
    organization: Test Org
    inventory: Test Org - Test Inventory
    project: Test Org - Test Project
    playbook: connect_linux.yml
    credentials:
      - Test Org - Machine Credential
    job_type: run
    job_slice_count: 1
    limit: dev
    verbosity: 0
    extra_vars:
      ansible_ssh_timeout: 15
    # instance_groups:
    #   - Test Org - Instance Group - Common
    roles:
      execute:
        teams:
          - t_api_users

  - name: Test Org - Linux Target Debug
    description: Debug Linux targets
    organization: Test Org
    inventory: Test Org - Test Inventory
    project: Test Org - Test Project
    playbook: debug.yml
    credentials:
      - Test Org - Machine Credential
    job_type: run
    job_slice_count: 1
    limit: dev
    verbosity: 0
    # instance_groups:
    #   - Test Org - Instance Group - Common
