#
# AAP organization - controller configuration - refresh Red Hat Automation Hub token
#

# NB. This is safe to run from several environments in parallel

# Uses Generic API Token controller credential type

controller_credentials_org_test_redhat_token:
  - name: Test Org - Red Hat Automation Hub
    organization: Test Org
    credential_type: Generic API Token
    inputs:
      url: https://console.redhat.com/api/automation-hub
      auth_url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
      token: "{{ aap_redhat_hub_token }}"

# Uses Test Org - EE localhost
# Uses Test Org - Test Project

controller_templates_org_test_redhat_token:
  - name: AAP Ops - Refresh Red Hat Token
    description: Refresh Red Hat Hybrid Cloud Console authentication token
    organization: Test Org
    inventory: Test Org - EE localhost
    project: Test Org - Test Project
    playbook: redhat_token_refresh.yml
    credentials:
      - Test Org - Red Hat Automation Hub
    job_type: run
    job_slice_count: 1

controller_schedules_org_test_redhat_token:
  - name: AAP Ops - Refresh Red Hat Token
    description: Scheduled Red Hat token refresh
    organization: Test Org
    unified_job_template: AAP Ops - Refresh Red Hat Token
    job_type: run
    inventory: Test Org - EE localhost
    rrule: DTSTART;TZID=Europe/Helsinki:20260101T010101 RRULE:FREQ=WEEKLY;INTERVAL=1
    enabled: true
