#
# AAP defaults configuration - delete defaults
#

controller_templates_org_default:
  - name: Demo Job Template
    organization: Default
    state: absent

controller_projects_org_default:
  - name: Demo Project
    organization: Default
    state: absent

controller_inventories_org_default:
  - name: Demo Inventory
    organization: Default
    state: absent

controller_credentials_org_default:
  # Managed credentials cannot be deleted
#  - name: Ansible Galaxy
#    organization: null
#    credential_type: Ansible Galaxy/Automation Hub API Token
#    state: absent
  - name: Demo Credential
    organization: Default
    credential_type: Machine
    state: absent

# https://redhat.atlassian.net/browse/AAP-79944
tbd_controller_execution_environments_org_default:
  - name: Default execution environment
    organization: Default
    image: null
    state: absent
  - name: Minimal execution environment
    organization: Default
    image: null
    state: absent
  - name: Hub Default execution environment
    organization: Default
    image: null
    state: absent
  - name: Hub Minimal execution environment
    organization: Default
    image: null
    state: absent

tbd_eda_credentials_org_default:
  - name: Hub Decision Environment Container Registry
    organization: Default
    credential_type: Container Registry
    state: absent

tbd_eda_decision_environments_org_default:
  - name: Hub Default Decision Environment
    organization: Default
    state: absent
  - name: Hub Minimal Decision Environment
    organization: Default
    state: absent

# Managed organizations cannot be deleted
# This definition matches the default AAP configuration
# to minimize difference when comparing live/repo configs
aap_organizations_org_default:
  - name: Default
#    state: absent
    description: The default organization for Ansible Automation Platform
    max_hosts: 0
    galaxy_credentials:
      - Ansible Galaxy
