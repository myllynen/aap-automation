---
- name: Create AAP OAuth Application token for service account use
  hosts: all
  connection: local
  become: false
  gather_facts: false
  vars:
    hostname: "{{ aap_hostname | regex_replace('^https?://', '') }}"

    # An AAP superuser is required
    # to manage OAuth Applications
    username: "{{ aap_username }}"
    password: "{{ aap_password }}"

    token_user_org: Test Org
    token_user_name: t_api_user
    token_scope: write

    token_force_new: false

    aap_validate_certs: false

  tasks:
    - name: Create AAP OAuth Application associated with service account user
      ansible.platform.application:
        aap_hostname: "{{ hostname }}"
        aap_username: "{{ username }}"
        aap_password: "{{ password }}"
        aap_validate_certs: "{{ aap_validate_certs }}"
        name: OAuth Application for {{ token_user_name }}
        description: OAuth Application for service account use
        organization: "{{ token_user_org }}"
        user: "{{ token_user_name }}"
        authorization_grant_type: authorization-code
        skip_authorization: false
        client_type: confidential
        pkce_required: true
        algorithm: RS256
        redirect_uris:
          - https://{{ hostname }}/api/gateway/v1/
        state: present
      register: oauth_application

    - name: Display AAP OAuth Application for {{ token_user_name }}
      ansible.builtin.debug:
        var: oauth_application
      when: oauth_application is changed

    - name: Create AAP OAuth Application token for service account user
      ansible.platform.token:
        aap_hostname: "{{ hostname }}"
        aap_username: "{{ username }}"
        aap_password: "{{ password }}"
        aap_validate_certs: "{{ aap_validate_certs }}"
        application: OAuth Application for {{ token_user_name }}
        description: OAuth Application token for service account use
        organization: "{{ token_user_org }}"
        scope: "{{ token_scope }}"
        state: present
      register: oauth_application_token
      when: >
        oauth_application is changed or
        token_force_new | bool

    - name: Display AAP OAuth Application token for {{ token_user_name }}
      ansible.builtin.debug:
        var: oauth_application_token
      when: oauth_application_token is changed
