---
- name: Check AAP connection and access
  hosts: all
  connection: local
  become: false
  gather_facts: false
  vars:
    hostname: "{{ aap_hostname | regex_replace('^https?://', '') }}"

    # These should come from vault
    # use either or, prefer token
    # username: "{{ aap_username }}"
    # password: "{{ aap_password }}"
    token: "{{ aap_token }}"

  tasks:
    - name: Test AAP connection
      ansible.builtin.uri:
        url: https://{{ hostname }}/api/gateway/v1/ping/
        validate_certs: "{{ aap_validate_certs | bool }}"
        method: GET
        status_code:
          - 200

    - name: Test AAP access
      no_log: "{{ aap_configuration_secure_logging | default(false) }}"
      ansible.builtin.uri:
        url: https://{{ hostname }}/api/gateway/v1/me/
        # url_username: "{{ username }}"
        # url_password: "{{ password }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        force_basic_auth: true
        method: GET
        headers:
          Authorization: Bearer {{ token }}
        status_code:
          - 200
